<!DOCTYPE html>
<html lang="ja">

  <title>Event Calendar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

</head>
<body>
<div class="app-shell">

  <header class="top-chrome">

    <div class="title-row">

                </td>
                <td class="fill-cell">
                  <div class="tile-fill"><img src="assets/ui/frames/minidot-8-5.png" alt="" class="tile-img tile-64"><img src="assets/ui/frames/minidot-8-5.png" alt="" class="tile-img tile-64"><img src="assets/ui/frames/minidot-8-5.png" alt="" class="tile-img tile-64"><img src="assets/ui/frames/minidot-8-5.png" alt="" class="tile-img tile-64"><img src="assets/ui/frames/minidot-8-5.png" alt="" class="tile-img tile-64"><img src="assets/ui/frames/minidot-8-5.png" alt="" class="tile-img tile-64"><img src="assets/ui/frames/minidot-8-5.png" alt="" class="tile-img tile-64"><img src="assets/ui/frames/minidot-8-5.png" alt="" class="tile-img tile-64"><img src="assets/ui/frames/minidot-8-5.png" alt="" class="tile-img tile-64"><img src="assets/ui/frames/minidot-8-5.png" alt="" class="tile-img tile-64"><img src="assets/ui/frames/minidot-8-5.png" alt="" class="tile-img tile-64"><img src="assets/ui/frames/minidot-8-5.png" alt="" class="tile-img tile-64"><img src="assets/ui/frames/minidot-8-5.png" alt="" class="tile-img tile-64"><img src="assets/ui/frames/minidot-8-5.png" alt="" class="tile-img tile-64"><img src="assets/ui/frames/minidot-8-5.png" alt="" class="tile-img tile-64"><img src="assets/ui/frames/minidot-8-5.png" alt="" class="tile-img tile-64"><img src="assets/ui/frames/minidot-8-5.png" alt="" class="tile-img tile-64"><img src="assets/ui/frames/minidot-8-5.png" alt="" class="tile-img tile-64"></div>
                </td>
                <td class="edge-y-cell">
                  <div class="tile-strip-y"><img src="assets/ui/frames/minidot-8-6.png" alt="" class="tile-img tile-64"><img src="assets/ui/frames/minidot-8-6.png" alt="" class="tile-img tile-64"><img src="assets/ui/frames/minidot-8-6.png" alt="" class="tile-img tile-64"></div>
                </td>
              </tr>
              <tr>
                <td class="corner-cell"><img src="assets/ui/frames/minidot-8-7.png" alt="" class="corner-img"></td>
                <td class="edge-x-cell">
                  <div class="tile-strip-x"><img src="assets/ui/frames/minidot-8-8.png" alt="" class="tile-img tile-64"><img src="assets/ui/frames/minidot-8-8.png" alt="" class="tile-img tile-64"><img src="assets/ui/frames/minidot-8-8.png" alt="" class="tile-img tile-64"><img src="assets/ui/frames/minidot-8-8.png" alt="" class="tile-img tile-64"><img src="assets/ui/frames/minidot-8-8.png" alt="" class="tile-img tile-64"><img src="assets/ui/frames/minidot-8-8.png" alt="" class="tile-img tile-64"><img src="assets/ui/frames/minidot-8-8.png" alt="" class="tile-img tile-64"><img src="assets/ui/frames/minidot-8-8.png" alt="" class="tile-img tile-64"><img src="assets/ui/frames/minidot-8-8.png" alt="" class="tile-img tile-64"><img src="assets/ui/frames/minidot-8-8.png" alt="" class="tile-img tile-64"></div>
                </td>
                <td class="corner-cell"><img src="assets/ui/frames/minidot-8-9.png" alt="" class="corner-img"></td>
              </tr>
            </tbody>
          </table>
        </span>
          <span class="top-tab-label">開催中</span>
      </button>

      <button class="top-tab" data-screen="calendar" type="button">
        
        <span class="tab-skin tab-skin-imgtiles" aria-hidden="true">
          <table class="tab-frame-img-table" role="presentation">
            <tbody>
              <tr>
                <td class="corner-cell"><img src="assets/ui/frames/minidot-8-1.png" alt="" class="corner-img"></td>
                <td class="edge-x-cell">
                  <div class="tile-strip-x"><img src="assets/ui/frames/minidot-8-2.png" alt="" class="tile-img tile-64"><img src="assets/ui/frames/minidot-8-2.png" alt="" class="tile-img tile-64"><img src="assets/ui/frames/minidot-8-2.png" alt="" class="tile-img tile-64"><img src="assets/ui/frames/minidot-8-2.png" alt="" class="tile-img tile-64"><img src="assets/ui/frames/minidot-8-2.png" alt="" class="tile-img tile-64"><img src="assets/ui/frames/minidot-8-2.png" alt="" class="tile-img tile-64"><img src="assets/ui/frames/minidot-8-2.png" alt="" class="tile-img tile-64"><img src="assets/ui/frames/minidot-8-2.png" alt="" class="tile-img tile-64"><img src="assets/ui/frames/minidot-8-2.png" alt="" class="tile-img tile-64"><img src="assets/ui/frames/minidot-8-2.png" alt="" class="tile-img tile-64"></div>
                </td>
                <td class="corner-cell"><img src="assets/ui/frames/minidot-8-3.png" alt="" class="corner-img"></td>
              </tr>
              <tr>
                <td class="edge-y-cell">
                  <div class="tile-strip-y"><img src="assets/ui/frames/minidot-8-4.png" alt="" class="tile-img tile-64"><img src="assets/ui/frames/minidot-8-4.png" alt="" class="tile-img tile-64"><img src="assets/ui/frames/minidot-8-4.png" alt="" class="tile-img tile-64"></div>
                </td>
                <td class="fill-cell">
                  <div class="tile-fill"><img src="assets/ui/frames/minidot-8-5.png" alt="" class="tile-img tile-64"><img src="assets/ui/frames/minidot-8-5.png" alt="" class="tile-img tile-64"><img src="assets/ui/frames/minidot-8-5.png" alt="" class="tile-img tile-64"><img src="assets/ui/frames/minidot-8-5.png" alt="" class="tile-img tile-64"><img src="assets/ui/frames/minidot-8-5.png" alt="" class="tile-img tile-64"><img src="assets/ui/frames/minidot-8-5.png" alt="" class="tile-img tile-64"><img src="assets/ui/frames/minidot-8-5.png" alt="" class="tile-img tile-64"><img src="assets/ui/frames/minidot-8-5.png" alt="" class="tile-img tile-64"><img src="assets/ui/frames/minidot-8-5.png" alt="" class="tile-img tile-64"><img src="assets/ui/frames/minidot-8-5.png" alt="" class="tile-img tile-64"><img src="assets/ui/frames/minidot-8-5.png" alt="" class="tile-img tile-64"><img src="assets/ui/frames/minidot-8-5.png" alt="" class="tile-img tile-64"><img src="assets/ui/frames/minidot-8-5.png" alt="" class="tile-img tile-64"><img src="assets/ui/frames/minidot-8-5.png" alt="" class="tile-img tile-64"><img src="assets/ui/frames/minidot-8-5.png" alt="" class="tile-img tile-64"><img src="assets/ui/frames/minidot-8-5.png" alt="" class="tile-img tile-64"><img src="assets/ui/frames/minidot-8-5.png" alt="" class="tile-img tile-64"><img src="assets/ui/frames/minidot-8-5.png" alt="" class="tile-img tile-64"></div>
                </td>
                <td class="edge-y-cell">
                  <div class="tile-strip-y"><img src="assets/ui/frames/minidot-8-6.png" alt="" class="tile-img tile-64"><img src="assets/ui/frames/minidot-8-6.png" alt="" class="tile-img tile-64"><img src="assets/ui/frames/minidot-8-6.png" alt="" class="tile-img tile-64"></div>
                </td>
              </tr>
              <tr>
                <td class="corner-cell"><img src="assets/ui/frames/minidot-8-7.png" alt="" class="corner-img"></td>
                <td class="edge-x-cell">
                  <div class="tile-strip-x"><img src="assets/ui/frames/minidot-8-8.png" alt="" class="tile-img tile-64"><img src="assets/ui/frames/minidot-8-8.png" alt="" class="tile-img tile-64"><img src="assets/ui/frames/minidot-8-8.png" alt="" class="tile-img tile-64"><img src="assets/ui/frames/minidot-8-8.png" alt="" class="tile-img tile-64"><img src="assets/ui/frames/minidot-8-8.png" alt="" class="tile-img tile-64"><img src="assets/ui/frames/minidot-8-8.png" alt="" class="tile-img tile-64"><img src="assets/ui/frames/minidot-8-8.png" alt="" class="tile-img tile-64"><img src="assets/ui/frames/minidot-8-8.png" alt="" class="tile-img tile-64"><img src="assets/ui/frames/minidot-8-8.png" alt="" class="tile-img tile-64"><img src="assets/ui/frames/minidot-8-8.png" alt="" class="tile-img tile-64"></div>
                </td>
                <td class="corner-cell"><img src="assets/ui/frames/minidot-8-9.png" alt="" class="corner-img"></td>
              </tr>
            </tbody>
          </table>
        </span>
          <span class="top-tab-label">イベントカレンダー</span>
      </button>
    </nav>

    <div class="lace-divider" aria-hidden="true"></div>
  </header>

  <main id="contentScroll" class="content-scroll">
    <div class="content-inner">

      <section id="screen-ongoing" class="screen active">
        <div class="today-row">
          <div class="today-title">
            <span>本日</span>
            <span class="today-calendar-icon">▣</span>
            <strong id="todayLabel"></strong>
          </div>
          <button id="refreshMockBtn" class="mini-action-btn" type="button">更新</button>
        </div>
        <div id="ongoingList" class="game-list"></div>
      </section>

      <section id="screen-calendar" class="screen">
        <div class="calendar-board calendar-board-full">
          <div class="calendar-grid">
            <div class="calendar-left">
              <div class="calendar-corner">ゲーム</div>
              <div id="calendarGameRows"></div>
            </div>

            <div class="calendar-right">
              <div id="calendarHeaderScroll" class="calendar-scroll header-scroll">
                <div id="calendarHeader" class="calendar-header-track"></div>
              </div>

              <div id="calendarBodyScroll" class="calendar-scroll body-scroll">
                <div id="todayLine" class="today-line"></div>
                <div id="calendarBody" class="calendar-body-track"></div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section id="screen-favorites" class="screen">
        <section class="frame9 frame-main simple-panel">
          <div class="frame9-grid">
            <div class="f f1"></div><div class="f f2"></div><div class="f f3"></div>
            <div class="f f4"></div>
            <div class="f f5">
              <span class="section-kicker">お気に入り</span>
              <h2>お気に入りイベント</h2>
              <p>お気に入り登録したイベントを並べる予定の仮画面です。</p>
            </div>
            <div class="f f6"></div>
            <div class="f f7"></div><div class="f f8"></div><div class="f f9"></div>
          </div>
        </section>
      </section>

      <section id="screen-settings" class="screen">
        <section class="frame9 frame-main simple-panel">
          <div class="frame9-grid">
            <div class="f f1"></div><div class="f f2"></div><div class="f f3"></div>
            <div class="f f4"></div>
            <div class="f f5">
              <span class="section-kicker">設定</span>
              <h2>設定</h2>
              <p>背景画像や表示設定を追加する予定の仮画面です。</p>
            </div>
            <div class="f f6"></div>
            <div class="f f7"></div><div class="f f8"></div><div class="f f9"></div>
          </div>
        </section>
      </section>

    </div>
  </main>

  <nav class="bottom-chrome" aria-label="下部ナビゲーション">
    <button class="bottom-nav-btn active" data-screen="ongoing"><span class="bottom-icon">▤</span><span>開催中</span></button>
    <button class="bottom-nav-btn" data-screen="calendar"><span class="bottom-icon">▦</span><span>カレンダー</span></button>
    <button class="bottom-nav-btn" data-screen="favorites"><span class="bottom-icon">☆</span><span>お気に入り</span></button>
    <button class="bottom-nav-btn" data-screen="settings"><span class="bottom-icon">⚙</span><span>設定</span></button>
  </nav>
</div>

<div id="detailOverlay" class="detail-overlay"></div>
<aside id="detailSheet" class="detail-sheet" aria-hidden="true">
  <section class="frame9 frame-main detail-panel">
    <div class="frame9-grid">
      <div class="f f1"></div><div class="f f2"></div><div class="f f3"></div>
      <div class="f f4"></div>
      <div class="f f5">
        <div class="detail-head">
          <div>
            <div id="detailGame" class="detail-game">ゲーム</div>
            <h2 id="detailTitle" class="detail-title">イベント名</h2>
          </div>
          <button id="closeDetailBtn" class="detail-close">×</button>
        </div>
        <div id="detailRemain" class="detail-remain"></div>
        <div id="detailDate" class="detail-date"></div>
        <div class="detail-section"><div class="detail-label">種類</div><div id="detailType"></div></div>
        <div class="detail-section"><div class="detail-label">限定報酬</div><div id="detailReward"></div></div>
        <div class="detail-section"><div class="detail-label">関連</div><div id="detailRelated"></div></div>
        <div class="detail-section"><div class="detail-label">メモ</div><p id="detailMemo"></p></div>
        <div class="detail-section"><div class="detail-label">出典</div><a id="detailSource" href="#" target="_blank" rel="noopener noreferrer">Wikiを開く</a></div>
        <button id="closeDetailBtnBottom" class="detail-bottom-btn">閉じる</button>
      </div>
      <div class="f f6"></div>
      <div class="f f7"></div><div class="f f8"></div><div class="f f9"></div>
    </div>
  </section>
</aside>


<div id="fetchOverlay" class="fetch-overlay" aria-hidden="true"></div>
<aside id="fetchSheet" class="fetch-sheet" aria-hidden="true" aria-label="イベント取得">
  <div class="fetch-sheet-head">
    <div>
      <span class="fetch-kicker">EVENT IMPORT</span>
      <h2>イベント取得</h2>
    </div>
    <button id="closeFetchBtn" class="fetch-close" type="button" aria-label="閉じる">×</button>
  </div>

  <p class="fetch-help">
    原神はSupabaseの中継を通してWikiから取得します。
    取得できた候補から表示したいイベントだけ選べます。開始日時が「Ver.○○アプデ後」などの場合は、その表記を残したまま反映できます。
  </p>

  <div id="fetchGameAccordions" class="fetch-game-accordions"></div>

  <div id="fetchStatus" class="fetch-status" aria-live="polite"></div>

  <div class="fetch-actions">
    <button id="applyFetchedEventsBtn" class="fetch-apply-btn" type="button">選択したイベントを反映</button>
    <button id="closeFetchBtnBottom" class="fetch-sub-btn" type="button">閉じる</button>
  </div>
</aside>

<script src="script.js"></script>
</body>
</html>
