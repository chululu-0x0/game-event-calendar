<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<title>Event Calendar</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&amp;family=Zen+Maru+Gothic:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="style.css" rel="stylesheet"/><link href="pixel-ui.css" rel="stylesheet"/>
</head>
<body class="css-layer-experiment">
<div class="app-shell">
<header class="top-chrome">
<div aria-label="バージョン" class="app-version">CSS-LAYER 1</div>
<div aria-hidden="true" class="checker-line checker-line-top"></div>
<nav aria-label="メイン画面" class="top-tabs">
<button class="top-tab active" data-screen="ongoing" type="button">
<span aria-hidden="true" class="tab-skin pixel-tab-skin" data-skin="standard"></span>
<span class="top-tab-label">開催中</span>
</button>
<button class="top-tab" data-screen="calendar" type="button">
<span aria-hidden="true" class="tab-skin pixel-tab-skin" data-skin="standard"></span>
<span class="top-tab-label">イベントカレンダー</span>
</button>
</nav>
<div aria-hidden="true" class="lace-divider"></div>
</header>
<main class="content-scroll" id="contentScroll">
<div class="content-inner">
<section class="screen active" id="screen-ongoing">
<div class="today-row">
<div class="today-title">
<span class="today-calendar-icon">▣</span>
<strong id="todayLabel"></strong>
</div>
<div class="today-actions">
<a aria-label="イベントを追加" class="mini-action-link mini-add-link" href="#" id="addEventBtn" title="追加">
<img alt="" class="mini-action-icon mini-action-icon-add" src="assets/ui/icon/icon-1.png"/>
<span class="visually-hidden">追加</span>
</a>
<a aria-label="イベントを更新" class="mini-action-link mini-refresh-link" href="#" id="refreshMockBtn" title="更新">
<img alt="" class="mini-action-icon mini-action-icon-refresh" src="assets/ui/icon/icon-1.png"/>
<span class="visually-hidden">更新</span>
</a>
</div>
</div>
<div class="game-list" id="ongoingList"></div>
</section>
<section class="screen" id="screen-calendar">
<div class="calendar-board calendar-board-full">
<div class="calendar-grid">
<div class="calendar-left">
<div class="calendar-corner">ゲーム</div>
<div class="calendar-game-scroll" id="calendarGameScroll">
<div id="calendarGameRows"></div>
</div>
</div>
<div class="calendar-right">
<div class="calendar-scroll header-scroll" id="calendarHeaderScroll">
<div class="calendar-header-track" id="calendarHeader"></div>
</div>
<div class="calendar-scroll body-scroll" id="calendarBodyScroll">
<div class="calendar-body-track" id="calendarBody"></div>
</div>
</div>
</div>
</div>
</section>
<section class="screen" id="screen-favorites">
<section class="frame9 frame-main simple-panel">
<div class="frame9-grid">
<div class="f f1"></div><div class="f f2"></div><div class="f f3"></div>
<div class="f f4"></div>
<div class="f f5">
<span class="section-kicker">お気に入り</span>
<h2>お気に入りイベント</h2>
<p>お気に入り登録したイベントを並べる予定の仮画面です。</p>
</div>
<div class="f f6"></div>
<div class="f f7"></div><div class="f f8"></div><div class="f f9"></div>
</div>
</section>
</section>
<section class="screen" id="screen-settings">
<section class="frame9 frame-main simple-panel">
<div class="frame9-grid">
<div class="f f1"></div><div class="f f2"></div><div class="f f3"></div>
<div class="f f4"></div>
<div class="f f5">
<span class="section-kicker">設定</span>
<h2>設定</h2>
<p>背景画像や表示設定を追加する予定の仮画面です。</p>
</div>
<div class="f f6"></div>
<div class="f f7"></div><div class="f f8"></div><div class="f f9"></div>
</div>
</section>
</section>
</div>
</main>
<nav aria-label="下部ナビゲーション" class="bottom-chrome">
<button class="bottom-nav-btn active" data-screen="ongoing"><span class="bottom-icon">▤</span><span>開催中</span></button>
<button class="bottom-nav-btn" data-screen="calendar"><span class="bottom-icon">▦</span><span>カレンダー</span></button>
<button class="bottom-nav-btn" data-screen="favorites"><span class="bottom-icon">☆</span><span>お気に入り</span></button>
<button class="bottom-nav-btn" data-screen="settings"><span class="bottom-icon">⚙</span><span>設定</span></button>
</nav>
</div>
<div aria-hidden="true" class="detail-overlay" id="detailOverlay"></div>
<aside aria-hidden="true" aria-label="イベント詳細" class="detail-sheet modal-card" id="detailSheet">
<section class="frame9 detail-outer-frame">
<div class="frame9-grid">
<div class="f f1"></div><div class="f f2"></div><div class="f f3"></div>
<div class="f f4"></div>
<div class="f f5">
<div class="detail-modal-layout">
<div class="detail-head">
<div class="detail-head-copy">
<div class="detail-game" id="detailGame">ゲーム</div>
<h2 class="detail-title" id="detailTitle">イベント名</h2>
</div>
<div class="detail-head-actions">
<button aria-label="イベントを編集" class="detail-edit-btn" id="editDetailBtn" title="編集" type="button">✎</button>
<button aria-label="閉じる" class="detail-close" id="closeDetailBtn" type="button">×</button>
</div>
</div>
<section class="frame9 detail-inner-frame">
<div class="frame9-grid">
<div class="f f1"></div><div class="f f2"></div><div class="f f3"></div>
<div class="f f4"></div>
<div class="f f5">
<div class="detail-scroll">
<div class="detail-remain" id="detailRemain"></div>
<div class="detail-date" id="detailDate"></div>
<div class="detail-section"><div class="detail-label">種類</div><div id="detailType"></div></div>
<div class="detail-section"><div class="detail-label">限定報酬</div><div id="detailReward"></div></div>
<div class="detail-section"><div class="detail-label">関連</div><div id="detailRelated"></div></div>
<div class="detail-section"><div class="detail-label">メモ</div><p id="detailMemo"></p></div>
<div class="detail-section"><div class="detail-label">出典</div><a href="#" id="detailSource" rel="noopener noreferrer" target="_blank">Wikiを開く</a></div>
<button class="detail-bottom-btn" id="closeDetailBtnBottom" type="button">閉じる</button>
</div>
</div>
<div class="f f6"></div>
<div class="f f7"></div><div class="f f8"></div><div class="f f9"></div>
</div>
</section>
</div>
</div>
<div class="f f6"></div>
<div class="f f7"></div><div class="f f8"></div><div class="f f9"></div>
</div>
</section>
</aside>
<div aria-hidden="true" class="fetch-overlay" id="fetchOverlay"></div>
<aside aria-hidden="true" aria-label="イベントチェック" class="fetch-sheet fetch-check-sheet" id="fetchSheet">
<section class="frame9 fetch-outer-frame">
<div class="frame9-grid">
<div class="f f1"></div><div class="f f2"></div><div class="f f3"></div>
<div class="f f4"></div>
<div class="f f5">
<div class="fetch-check-content">
<div class="check-sheet-topline">
<span class="fetch-kicker">EVENT CHECK</span>
<button aria-label="閉じる" class="fetch-close check-sheet-close" id="closeFetchBtn" type="button">×</button>
</div>
<section class="frame9 fetch-progress-frame">
<div class="frame9-grid">
<div class="f f1"></div><div class="f f2"></div><div class="f f3"></div>
<div class="f f4"></div>
<div class="f f5">
<details class="check-progress-details" id="checkProgressDetails" open="">
<summary class="check-progress-titlebar">
<span class="check-progress-title">チェック進捗</span>
<button class="fetch-all-btn" id="fetchAllGamesBtn" type="button">全ゲームチェック</button>
<span aria-hidden="true" class="check-progress-chevron"></span>
</summary>
<div aria-labelledby="checkProgressTitle" class="check-progress-panel">
<div class="check-progress-summary">
<strong id="checkProgressTitle">全体進捗</strong>
<div aria-hidden="true" class="check-progress-track"><div class="check-progress-fill" id="checkProgressFill"></div></div>
<span class="check-progress-count" id="checkProgressCount">0 / 5 ゲーム</span>
</div>
<div class="check-game-list" id="fetchProgressGames"></div>
</div>
</details>
</div>
<div class="f f6"></div>
<div class="f f7"></div><div class="f f8"></div><div class="f f9"></div>
</div>
</section>
<div class="check-result-heading">
<h2>チェック結果</h2>
<span class="check-result-note">チェックを外した候補は次回から除外</span>
</div>
<div class="fetch-game-accordions check-result-list" id="fetchGameAccordions"></div>
<div aria-live="polite" class="fetch-status fetch-status-sr" id="fetchStatus"></div>
<div class="fetch-actions check-register-actions">
<button class="fetch-apply-btn check-register-btn" id="applyFetchedEventsBtn" type="button">選択したイベントを登録（0件）</button>
</div>
</div>
</div>
<div class="f f6"></div>
<div class="f f7"></div><div class="f f8"></div><div class="f f9"></div>
</div>
</section>
</aside>
<div aria-hidden="true" class="edit-overlay" id="editOverlay"></div>
<aside aria-hidden="true" aria-label="イベント編集" class="edit-sheet modal-card" id="editSheet">
<section class="frame9 edit-outer-frame">
<div class="frame9-grid">
<div class="f f1"></div><div class="f f2"></div><div class="f f3"></div>
<div class="f f4"></div>
<div class="f f5">
<form class="edit-form" id="editEventForm">
<div class="edit-sheet-head">
<div>
<span class="fetch-kicker">EVENT EDIT</span>
<h2 id="editSheetTitle">イベント編集</h2>
<div class="edit-game-label" id="editGameLabel"></div>
</div>
<button aria-label="閉じる" class="fetch-close" id="closeEditBtn" type="button">×</button>
</div>
<div class="edit-content-scroll edit-scroll">
<label class="edit-field edit-game-field" hidden="" id="editGameField">
<span>ゲーム</span>
<select id="editGameSelect"></select>
</label>
<label class="edit-field">
<span>イベント名</span>
<input id="editTitle" required="" type="text"/>
</label>
<label class="edit-field">
<span>種類</span>
<input id="editType" placeholder="未設定" type="text"/>
</label>
<label class="edit-field">
<span>限定報酬</span>
<textarea id="editReward" placeholder="未設定" rows="3"></textarea>
</label>
<div class="edit-two-col">
<label class="edit-field edit-date-field">
<span>開始日時</span>
<span class="datetime-input-wrap"><input id="editStart" type="datetime-local"/></span>
</label>
<label class="edit-field edit-date-field">
<span>終了日時</span>
<span class="datetime-input-wrap"><input id="editEnd" type="datetime-local"/></span>
</label>
</div>
<label class="edit-field">
<span>メモ</span>
<textarea id="editMemo" rows="4"></textarea>
</label>
<label class="edit-field">
<span>出典URL</span>
<input id="editSource" inputmode="url" placeholder="https://..." type="url"/>
</label>
<div aria-live="polite" class="edit-status" id="editStatus"></div>
</div>
<div class="edit-actions">
<button class="fetch-apply-btn" id="editSubmitBtn" type="submit">保存</button>
<button class="fetch-sub-btn is-delete" id="cancelEditBtn" type="button">削除</button>
</div>
</form>
</div>
<div class="f f6"></div>
<div class="f f7"></div><div class="f f8"></div><div class="f f9"></div>
</div>
</section>
</aside>
<script src="script.js"></script>
</body>
</html>
